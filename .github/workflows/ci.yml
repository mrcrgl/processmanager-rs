name: Rust CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    name: Build & test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta, nightly]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt

      # Re-use cargo build cache for faster CI runs
      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.toolchain }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
          cargo clippy --all-targets --no-default-features -- -D warnings
          cargo clippy --all-targets --no-default-features --features log -- -D warnings
          cargo clippy --all-targets --features log -- -D warnings

      - name: Build docs (deny warnings)
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Run tests (default features)
        run: cargo test --all

      - name: Run tests (no default features)
        run: cargo test --no-default-features

      - name: Run tests (log feature)
        run: cargo test --features log

      - name: Run examples
        run: |
          timeout 30s cargo run --example simple
          timeout 45s cargo run --example dynamic_add
          timeout 30s cargo run --example restart_supervisor
          timeout 30s cargo run --example runtime_context
          timeout 30s cargo run --example axum

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust (1.85)
        uses: dtolnay/rust-toolchain@1.85

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}

      - name: Check (all features)
        run: cargo check --locked --all-targets --all-features

      - name: Check (no default features)
        run: cargo check --locked --all-targets --no-default-features
